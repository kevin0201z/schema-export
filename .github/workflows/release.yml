name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: build-linux build-windows
          - os: macos-15
            target: build-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./... -count=1
      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: make $TARGET VERSION="$VERSION"
      - name: Verify macOS binaries
        if: runner.os == 'macOS'
        run: |
          sh scripts/check-macos-build.sh build/schema-export-darwin-amd64 amd64 1
          sh scripts/check-macos-build.sh build/schema-export-darwin-arm64 arm64 1
          ./build/schema-export-darwin-arm64 --version
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: build/schema-export-*
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: build
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$VERSION" \
            build/schema-export-linux-amd64 \
            build/schema-export-windows-amd64.exe \
            build/schema-export-darwin-amd64 \
            build/schema-export-darwin-arm64 \
            --verify-tag --title "Release $VERSION" --generate-notes
